behaviors:
  swim-straight:
    trainer_type: ppo

    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 2e6
    time_horizon: 128
    summary_freq: 10000

    keep_checkpoints: 10
    checkpoint_interval: 500000

env_settings:
  env_path: Executable\SMARCUnityHDRP2.exe
  num_envs: 4

engine_settings:
  no_graphics: true

checkpoint_settings:
  run_id: swim-straight+
  force: true
  resume: false